name: Phase 7 backup conflict rehearsal
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  backup-conflict:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/phase7-backup-conflict-regression'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run setup:research-browser
      - run: npm run test:research-import-browser
