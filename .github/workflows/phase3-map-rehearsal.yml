name: Phase 3 map rehearsal
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  map:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/phase3-packaged-map-tags'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/template-selects.test.mjs tests/nearby-map.test.mjs tests/planning-map.test.mjs tests/next-places.test.mjs
      - run: npm ci --ignore-scripts
      - run: npm run setup:research-browser
      - run: node --test --test-timeout=60000 tests/browser/research-map-browser.test.mjs
