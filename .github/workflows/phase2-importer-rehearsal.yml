name: Phase 2 importer rehearsal
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  importer:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/phase2-research-import-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/research-import-ui.test.mjs tests/research-offline.test.mjs tests/research-offline-status.test.mjs
      - run: node --test tests/trip-note-drafts.test.mjs
      - run: npm ci --ignore-scripts
      - run: npm run setup:research-browser
      - run: npm run test:research-import-browser
      - run: node --test --test-timeout=60000 tests/browser/trip-location-browser.test.mjs
