name: Phase 6 personal restore rehearsal
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  personal-restore:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/phase6-personal-confirmation-restore'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/personal-confirmation-restore.test.mjs tests/research-cloud.test.mjs tests/research-import-ui.test.mjs tests/research-offline.test.mjs tests/research-offline-status.test.mjs
      - run: npm ci --ignore-scripts
      - run: npm run setup:research-browser
      - run: npm run test:research-import-browser
